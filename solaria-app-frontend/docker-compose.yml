version: '3.8'

services:
  solaria-frontend:
    build: .
    ports:
      - "8080:80"
    container_name: solaria-app-frontend
    restart: unless-stopped

  # Opcional: Servicio para desarrollo con hot reload
  solaria-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    container_name: solaria-app-dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
